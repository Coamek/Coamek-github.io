name: Check Instagram importer

on:
  pull_request:
    paths:
      - '*.html'
      - '*.css'
      - '*.js'
      - 'assets/**'
      - 'data/instagram-*.json'
      - 'scripts/**'
      - '.github/workflows/instagram-*.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-instagram.txt
      - run: python -m pip install -r scripts/requirements-instagram.txt
      - run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Check the saved gallery renders without Instagram access
        run: |
          python scripts/sync_instagram.py --render-only
          git diff --exit-code -- photography.html
      - name: Check public portfolio assets
        run: python scripts/package_pages.py --output "$RUNNER_TEMP/portfolio-site"
